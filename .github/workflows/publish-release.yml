name: Publish release

on:
  push:
    branches: [release-upload]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete previous release (1.0.5)
        run: |
          for tag in 1.0.5; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
      - name: Create release
        run: |
          APK=$(ls On-Safe-*.apk)
          VERSION=${APK#On-Safe-}; VERSION=${VERSION%.apk}
          # 공유 링크 releases/latest/download/On-Safe.apk 와 이름을 맞춤
          cp "$APK" On-Safe.apk
          gh release create "$VERSION" On-Safe.apk --title "On-Safe $VERSION" --target main --latest \
            --notes "보고 양식 임시 저장"
